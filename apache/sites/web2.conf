<VirtualHost *:80>
    ServerName web2.local
    DocumentRoot /var/www/html/public/uploads/web2

    <Directory /var/www/html/public/uploads/web2>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/web2_error.log
    CustomLog ${APACHE_LOG_DIR}/web2_access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
    <VirtualHost *:443>
        ServerName web2.local
        DocumentRoot /var/www/html/public/uploads/web2

        # Zapnutí SSL
        SSLEngine on
        SSLCertificateFile /etc/ssl/certs/ssl-cert-snakeoil.pem
        SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key

        <Directory /var/www/html/public/uploads/web2>
            Options Indexes FollowSymLinks
            AllowOverride All
            Require all granted
        </Directory>

        ErrorLog ${APACHE_LOG_DIR}/web2_error.log
        CustomLog ${APACHE_LOG_DIR}/web2_access.log combined
    </VirtualHost>
</IfModule>