<VirtualHost *:80>
    ServerName web1.local
    DocumentRoot /var/www/html/public/uploads/web1

    <Directory /var/www/html/public/uploads/web1>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/web1_error.log
    CustomLog ${APACHE_LOG_DIR}/web1_access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
    <VirtualHost *:443>
        ServerName web1.local
        DocumentRoot /var/www/html/public/uploads/web1

        # Zapnutí SSL
        SSLEngine on
        SSLCertificateFile /etc/ssl/certs/ssl-cert-snakeoil.pem
        SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key

        <Directory /var/www/html/public/uploads/web1>
            Options Indexes FollowSymLinks
            AllowOverride All
            Require all granted
        </Directory>

        ErrorLog ${APACHE_LOG_DIR}/web1_error.log
        CustomLog ${APACHE_LOG_DIR}/web1_access.log combined
    </VirtualHost>
</IfModule>