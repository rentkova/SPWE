# Hlavní virtual host – obsluhuje localhost i app.local
<VirtualHost *:80>
    ServerName localhost
    ServerAlias app.local
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Weby zákazníků dostupné přes /w/nazev-webu/
    # Příklad: http://localhost/w/web1/  →  ./www/web1/
    Alias /w/ /var/www/html/public/uploads/

    <Directory /var/www/html/public/uploads>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
    <VirtualHost *:443>
        ServerName localhost
        ServerAlias app.local
        DocumentRoot /var/www/html

        SSLEngine on
        SSLCertificateFile /etc/ssl/certs/hosting.crt
        SSLCertificateKeyFile /etc/ssl/private/hosting.key

        <Directory /var/www/html>
            AllowOverride All
            Require all granted
        </Directory>

        Alias /w/ /var/www/html/public/uploads/

        <Directory /var/www/html/public/uploads>
            AllowOverride All
            Require all granted
        </Directory>
    </VirtualHost>
</IfModule>

# Wildcard virtual host – funguje pokud má někdo *.local v hosts nebo DNS
<VirtualHost *:80>
    ServerAlias *.local
    VirtualDocumentRoot /var/www/html/public/uploads/%1
    UseCanonicalName Off

    <Directory /var/www/html/public/uploads>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<IfModule mod_ssl.c>
    <VirtualHost *:443>
        ServerAlias *.local
        VirtualDocumentRoot /var/www/html/public/uploads/%1
        UseCanonicalName Off

        SSLEngine on
        SSLCertificateFile /etc/ssl/certs/hosting.crt
        SSLCertificateKeyFile /etc/ssl/private/hosting.key

        <Directory /var/www/html/public/uploads>
            AllowOverride All
            Require all granted
        </Directory>
    </VirtualHost>
</IfModule>
